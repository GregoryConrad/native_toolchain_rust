name: native_toolchain_rust_workspace
repository: https://github.com/GregoryConrad/native_toolchain_rust
publish_to: none

environment:
  sdk: ^3.9.0

workspace:
  - native_toolchain_rust
  - examples/dart_only
  - examples/flutter

dev_dependencies:
  melos: ^8.10.1
  very_good_analysis: ^11.0.0

melos:
  scripts:
    test:
      description: Run unit tests for a specific package in this project.
      packageFilters:
        dirExists: test
      exec:
        command: flutter test test
        concurrency: 1
        failFast: true
